name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure + Leiningen
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-anvil-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-m2-anvil-

      - name: Install chengis-core v0.4.1
        run: |
          git clone --depth 1 --branch v0.4.1 \
            https://github.com/SuperBadLabs/chengis-core.git /tmp/chengis-core
          (cd /tmp/chengis-core && lein install)

      - name: Verify tag matches project.clj version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJ_VERSION=$(head -1 project.clj | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG" != "$PROJ_VERSION" ]; then
            echo "::error::Tag v$TAG does not match project.clj version $PROJ_VERSION"
            exit 1
          fi

      - name: Build uberjar
        run: lein uberjar

      - name: Locate uberjar
        id: jar
        run: |
          JAR=$(ls target/uberjar/anvil-*-standalone.jar | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT
          ls -lh "$JAR"

      - name: Create GitHub release with uberjar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            "${{ steps.jar.outputs.path }}" \
            --title "anvil $TAG" \
            --generate-notes \
            --verify-tag
