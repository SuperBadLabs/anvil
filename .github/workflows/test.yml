name: test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  LEIN_JVM_OPTS: '--enable-native-access=ALL-UNNAMED'

jobs:
  # Fast default suite — pure Clojure, no browser needed
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure + Leiningen
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-anvil-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-m2-anvil-

      - name: Install chengis-core v0.3.0
        run: |
          # chengis-core 0.3.0 shipped with anvil 0.3.3. Pinned install —
          # 0.3.0 adds the chengis.tools.{http,archive,checksum,platform,
          # temurin,maven,gradle,node} installer matrix that anvil's
          # tool() step depends on. Next bump when chengis-core ships
          # 0.4.0 (or whatever the next minor turns into).
          rm -rf /tmp/chengis-core
          git clone --depth 1 --branch v0.3.0 \
            https://github.com/SuperBadLabs/chengis-core.git /tmp/chengis-core
          (cd /tmp/chengis-core && lein install)

      - name: lein test (default selector)
        run: lein test

  # Browser/etaoin smoke — opt-in tagged tests, needs Firefox
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure + Leiningen
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          # Authenticated requests use the per-repo 1000/hr quota
          # instead of the anon 60/hr (which intermittently 403'd
          # on the v0.3 PR train).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-anvil-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-m2-anvil-

      - name: Install chengis-core v0.3.0
        run: |
          # chengis-core 0.3.0 shipped with anvil 0.3.3. Pinned install —
          # 0.3.0 adds the chengis.tools.{http,archive,checksum,platform,
          # temurin,maven,gradle,node} installer matrix that anvil's
          # tool() step depends on. Next bump when chengis-core ships
          # 0.4.0 (or whatever the next minor turns into).
          rm -rf /tmp/chengis-core
          git clone --depth 1 --branch v0.3.0 \
            https://github.com/SuperBadLabs/chengis-core.git /tmp/chengis-core
          (cd /tmp/chengis-core && lein install)

      - name: lein test :browser
        run: lein test :browser
